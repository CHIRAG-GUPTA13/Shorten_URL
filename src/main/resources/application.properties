# Default Configuration
# This configuration is used as fallback and for development

# Active Profile Configuration
# Default profile is 'local' for development
# Set via: spring.profiles.active=prod or environment variable SPRING_PROFILES_ACTIVE
spring.profiles.active=local
spring.application.name=urlshortener

# Common Datasource Configuration (used as defaults)
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings - Performance Optimized
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration - Performance Optimized
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Server Configuration
server.port=8080
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# JWT Configuration
app.jwt.secret=YourSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong123456
app.jwt.expiration-milliseconds=86400000

# SQL initialization - disable to rely on Hibernate ddl-auto
# Using Hibernate to create tables automatically
spring.sql.init.mode=never

# Cleanup Scheduler Configuration
# Enable/disable automatic cleanup of expired URLs
app.cleanup.expired-urls.enabled=true
# Cron expression for cleanup task (default: every hour at minute 0)
app.cleanup.expired-urls.cron=0 0 * * * *
# Batch size for processing expired URLs
app.cleanup.expired-urls.batch-size=100

# Redis Cache Configuration - Performance Optimized
# Enable/disable Redis caching
app.cache.redis.enabled=true
# Redis host (default: localhost)
spring.data.redis.host=localhost
# Redis port (default: 6379)
spring.data.redis.port=6379
# Redis connection pool settings
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms
# Redis password (optional)
# spring.data.redis.password=
# Cache TTL in seconds (default: 86400 = 24 hours)
app.cache.url.ttl=86400

# Rate Limiting Configuration
# Enable/disable rate limiting
app.ratelimit.enabled=true
# Maximum requests allowed per window
app.ratelimit.shorten.requests=10
# Time window in seconds (1 minute = 60 seconds)
app.ratelimit.shorten.window-seconds=60
# Enable Redis backend for distributed rate limiting (survives restarts)
app.ratelimit.redis.enabled=true

# QR Code Configuration
# QR code width in pixels
app.qr.width=300
# QR code height in pixels
app.qr.height=300
# Base URL prepended to shortCode to form full short URL
app.qr.base-url=http://localhost:8080
# QR code cache TTL in seconds (7 days = 604800 seconds)
app.qr.cache.ttl=604800

# Bulk URL Shortening Configuration
# Maximum URLs per bulk job
app.bulk.max-urls-per-job=10000
# Base URL for shortened URLs in bulk results
app.bulk.base-url=http://localhost:8080

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true

# CORS Configuration
cors.allowed-origins=http://localhost:4200,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept
cors.exposed-headers=Authorization
cors.max-age=3600

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=click-events-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.shortenurl.dto
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
